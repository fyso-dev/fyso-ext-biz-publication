name = "fyso-biz-panel-publication-example"
main = "worker.mjs"
compatibility_date = "2026-06-18"
workers_dev = false
preview_urls = false

[[durable_objects.bindings]]
name = "PUBLICATION_RELAY"
class_name = "PanelPublication"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PanelPublication"]

[vars]
PUBLICATION_CONTROL_HOST = "publish.example.com"
PUBLICATION_ASSIGNMENTS = "{}"
BIZ_ORIGIN = "https://fyso.biz"

[[routes]]
pattern = "publish.example.com"
custom_domain = true

[[routes]]
pattern = "panel.demo.example.com"
custom_domain = true

[[routes]]
pattern = "auth.demo.example.com"
custom_domain = true
